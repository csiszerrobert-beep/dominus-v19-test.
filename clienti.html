<!DOCTYPE html>
<html lang="ro"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="#152e51" name="theme-color"/><link href="./manifest.webmanifest" rel="manifest"/><title>Dominus – Registru clienți</title><style>*{box-sizing:border-box}body{margin:0;background:#edf2f7;color:#173252;font:16px system-ui,Arial,sans-serif}header{background:#152e51;color:white;padding:18px 16px}header a{color:white;text-decoration:none}main{max-width:850px;margin:auto;padding:15px}h1{font-size:24px;margin:8px 0}h2{font-size:19px;margin:0 0 10px}.card{background:white;border-radius:13px;padding:15px;margin:12px 0;box-shadow:0 2px 9px #112c4b13}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}button,.btn{background:#173b65;color:white;border:0;border-radius:9px;padding:11px 13px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}button.secondary,.btn.secondary{background:#e5edf6;color:#173252}button.danger{background:#a83333}input,textarea,select{font:inherit;padding:11px;border:1px solid #afc1d3;border-radius:8px;width:100%;margin:4px 0 11px}label{font-weight:600;font-size:14px}textarea{min-height:75px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:#5d7084;font-size:14px}.person{border-top:1px solid #e1e8ef;padding:12px 0}.person h3{margin:0 0 6px}.person p{margin:4px 0;overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.actions button,.actions .btn{font-size:14px;padding:8px 10px}dialog{width:min(96vw,560px);border:0;border-radius:15px;padding:0;max-height:90vh}dialog::backdrop{background:#071c30a8}.modal{padding:18px;overflow:auto;max-height:90vh}.hidden{display:none}@media(max-width:430px){.two{grid-template-columns:1fr}}</style></head><body><header><a href="index.html">‹ Meniu principal</a><h1>👥 Registru clienți</h1></header><main><div class="card"><p class="muted">Clienții sunt salvați local pe acest dispozitiv. Poți selecta un client existent și în Programator.</p><div class="toolbar"><button id="add">＋ Client nou</button><button class="secondary" id="export">⬇ Export clienți</button><button class="secondary" id="dedup" type="button">Verifică duplicatele</button><button class="secondary" id="import">⬆ Import clienți</button><input accept=".json,application/json" class="hidden" id="importFile" type="file"/></div><label for="search">Caută după nume, telefon sau adresă</label><input id="search" placeholder="Caută client..."/><p class="muted" id="count"></p><div id="list"></div></div></main><dialog id="editor"><form class="modal" id="form"><h2 id="heading">Client nou</h2><input id="id" type="hidden"/><label for="name">Nume client / Firmă *</label><input id="name" maxlength="150" required=""/><label for="phone">Telefon</label><input id="phone" maxlength="40" type="tel"/><label for="email">E-mail</label><input id="email" maxlength="160" type="email"/><label for="address">Adresă</label><input id="address" maxlength="250"/><label for="notes">Observații</label><textarea id="notes" maxlength="2000"></textarea><div class="toolbar"><button type="submit">💾 Salvează</button><button class="secondary" id="cancel" type="button">Renunță</button></div></form></dialog><script> 'use strict';
const KEY='dominus-clienti-v1', $=id=>document.getElementById(id), fields=['name','phone','email','address','notes'];
const txt=x=>String(x??'');const esc=x=>txt(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let clients=[];try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(data))clients=data.filter(c=>c&&typeof c.id==='string'&&typeof c.name==='string');}catch(e){alert('Nu se poate citi registrul. Datele nu au fost șterse.');}
function save(){try{localStorage.setItem(KEY,JSON.stringify(clients));return true}catch(e){alert('Salvarea a eșuat. Verifică spațiul disponibil.');return false}}
function render(){const q=$('search').value.trim().toLocaleLowerCase('ro');const list=clients.filter(c=>[c.name,c.phone,c.email,c.address].some(v=>txt(v).toLocaleLowerCase('ro').includes(q))).sort((a,b)=>a.name.localeCompare(b.name,'ro'));$('count').textContent=list.length+' clienți afișați din '+clients.length;$('list').innerHTML=list.length?list.map(c=>`<article class="person"><h3>${esc(c.name)}</h3>${c.phone?`<p>📞 ${esc(c.phone)}</p>`:''}${c.email?`<p>✉️ ${esc(c.email)}</p>`:''}${c.address?`<p>📍 ${esc(c.address)}</p>`:''}${c.notes?`<p class="muted">${esc(c.notes)}</p>`:''}<div class="actions">${c.phone?`<a class="btn secondary" href="tel:${encodeURIComponent(c.phone.replace(/[^+\d]/g,''))}">Sună</a>`:''}${c.address?`<a class="btn secondary" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.address)}">Hartă</a>`:''}<a class="btn secondary" href="programator.html?clientId=${encodeURIComponent(c.id)}">📅 Programează</a><button class="secondary" data-edit="${esc(c.id)}">Editează</button><button class="danger" data-del="${esc(c.id)}">Șterge</button></div></article>`).join(''):'<p class="muted">Nu există clienți pentru această căutare.</p>'}
function openEditor(c){$('form').reset();$('id').value=c?.id||'';for(const f of fields)if(c)$(f).value=txt(c[f]);$('heading').textContent=c?'Modifică client':'Client nou';$('editor').showModal()}
$('add').onclick=()=>openEditor();$('cancel').onclick=()=>$('editor').close();$('search').oninput=render;
$('form').onsubmit=e=>{e.preventDefault();const id=$('id').value||(crypto.randomUUID?.()||Date.now()+'-'+Math.random());const c={id};for(const f of fields)c[f]=$(f).value.trim();if(!c.name)return;const prev=clients.slice();const ix=clients.findIndex(x=>x.id===id);if(ix>=0)clients[ix]=c;else clients.push(c);if(!save()){clients=prev;return}$('editor').close();render()};
$('list').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.edit||b.dataset.del;const c=clients.find(x=>x.id===id);if(!c)return;if(b.dataset.edit)openEditor(c);else if(confirm('Ștergi clientul '+c.name+' din registru? Programările existente vor rămâne salvate.')){const prev=clients;clients=clients.filter(x=>x.id!==id);if(!save())clients=prev;render()}};
function download(name,body){const blob=new Blob([body],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
$('export').onclick=()=>download('Dominus_clienti_backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'Dominus Clienti',version:1,exportedAt:new Date().toISOString(),clients},null,2));
$('import').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(data.app!=='Dominus Clienti'||!Array.isArray(data.clients)||data.clients.some(c=>!c||typeof c.id!=='string'||typeof c.name!=='string'||!c.name.trim()||fields.some(k=>c[k]!=null&&typeof c[k]!=='string')))throw Error('Invalid');if(!confirm('Importul va ÎNLOCUI registrul actual. Ai făcut export înainte?'))return;const prev=clients;clients=data.clients.map(c=>Object.fromEntries(['id',...fields].map(k=>[k,txt(c[k])])));if(!save())clients=prev;render()}catch(err){alert('Fișier invalid. Registrul nu a fost înlocuit.')}finally{e.target.value=''}};
render();if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

// V19.23: curatare optionala, cu backup inainte de modificare.
$('dedup').onclick=()=>{
 const norm=s=>txt(s).trim().toLocaleLowerCase('ro').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
 const phone=s=>txt(s).replace(/[^\d+]/g,'');
 const groups=new Map();
 clients.forEach(c=>{const ph=phone(c.phone),addr=norm(c.address);if(!ph||!addr)return;const k=ph+'|'+addr;groups.set(k,[...(groups.get(k)||[]),c])});
 const removals=new Set(),updates=new Map();let count=0;
 for(const group of groups.values()){
   if(group.length<2)continue;
   group.sort((a,b)=>b.name.length-a.name.length);
   for(let i=0;i<group.length;i++){
     const main=group[i];if(removals.has(main.id))continue;
     const merged={...updates.get(main.id)||main};
     for(let j=i+1;j<group.length;j++){
       const other=group[j];if(removals.has(other.id))continue;
       const a=norm(merged.name),b=norm(other.name);
       if(Math.min(a.length,b.length)<3||!(a.startsWith(b)||b.startsWith(a)))continue;
       // Nu uni fise cu date contradictorii.
       if(merged.email&&other.email&&norm(merged.email)!==norm(other.email))continue;
       for(const k of ['phone','email','address','notes'])if(!merged[k]&&other[k])merged[k]=other[k];
       removals.add(other.id);count++;
     }
     updates.set(main.id,merged);
   }
 }
 if(!count){alert('Nu au fost gasite duplicate sigure. Clientii cu acelasi telefon, dar nume diferite, nu sunt uniti automat.');return}
 if(!confirm('Am gasit '+count+' inregistrari partiale duplicate (acelasi telefon si adresa, nume prescurtat). Se descarca mai intai un backup, apoi se unesc. Continui?'))return;
 download('Dominus_clienti_INAINTE_DE_CURATARE_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'Dominus Clienti',version:1,exportedAt:new Date().toISOString(),clients},null,2));
 const prev=clients;clients=clients.filter(c=>!removals.has(c.id)).map(c=>updates.get(c.id)||c);
 if(!save()){clients=prev;return}render();alert('Au fost unite '+count+' inregistrari. Pastreaza fisierul backup.');
};
</script></body></html>
