<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#eff4f9;color:#17324a;font:16px system-ui,sans-serif}main{max-width:850px;margin:7vh auto;padding:22px}.panel{background:white;border:1px solid #d8e2ed;border-radius:18px;padding:24px;box-shadow:0 10px 30px #18334d12}h1{margin-top:0}label{display:block;font-weight:600;margin-top:15px}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #b9c9d7;border-radius:9px;font:inherit}button,.link{display:inline-block;background:#174f79;color:white;border:0;border-radius:9px;padding:12px 17px;margin:12px 7px 0 0;font:inherit;cursor:pointer;text-decoration:none}button:disabled{opacity:.5}.secondary{background:#dce9f4;color:#17324a}.muted{color:#53687b}.error{color:#a52626;white-space:pre-wrap}.ok{color:#17613a}.entry{border-top:1px solid #d8e2ed;padding:16px 0}.actions{display:flex;flex-wrap:wrap;gap:5px}.actions button{font-size:13px;margin:5px 0}#message{min-height:25px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="./dominus-config.js"></script><script src="./dominus-auth.js"></script><title>DOMINUS V20 – Autentificare</title></head><body><main><div class="panel"><h1>DOMINUS V20 TEST</h1><p class="muted">Autentificare ADMIN / TEHNICIAN</p><form id="form"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Parolă<input id="password" type="password" autocomplete="current-password" required></label><button id="submit" type="submit">Conectare</button></form><p id="message" role="status"></p><p class="muted">Datele V19 rămân local în browser. Tehnicienii nu au acces la registrele vechi până la migrarea securizată.</p></div></main><script>
const $=id=>document.getElementById(id),a=window.DominusAuth;
async function route(){const p=await a.profile();if(p){location.replace(p.role==='admin'?'./admin.html':'./tehnician.html');return true;}return false;}
(async()=>{if(!a.configured){$('message').className='error';$('message').textContent='Configurează cheia publică Supabase în dominus-config.js înainte de testare.';return;}await route();})();
$('form').addEventListener('submit',async e=>{e.preventDefault();$('submit').disabled=true;$('message').textContent='Se verifică autentificarea…';try{const {error}=await a.client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;const p=await a.profile();if(!p){await a.client.auth.signOut();throw Error('Cont inactiv sau profil indisponibil.');}location.replace(p.role==='admin'?'./admin.html':'./tehnician.html');}catch(e){$('message').className='error';$('message').textContent=e.message;}finally{$('submit').disabled=false;}});
</script></body></html>
