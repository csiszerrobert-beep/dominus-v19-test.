<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#eff4f9;color:#17324a;font:16px system-ui,sans-serif}main{max-width:850px;margin:7vh auto;padding:22px}.panel{background:white;border:1px solid #d8e2ed;border-radius:18px;padding:24px;box-shadow:0 10px 30px #18334d12}h1{margin-top:0}label{display:block;font-weight:600;margin-top:15px}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #b9c9d7;border-radius:9px;font:inherit}button,.link{display:inline-block;background:#174f79;color:white;border:0;border-radius:9px;padding:12px 17px;margin:12px 7px 0 0;font:inherit;cursor:pointer;text-decoration:none}button:disabled{opacity:.5}.secondary{background:#dce9f4;color:#17324a}.muted{color:#53687b}.error{color:#a52626;white-space:pre-wrap}.ok{color:#17613a}.entry{border-top:1px solid #d8e2ed;padding:16px 0}.actions{display:flex;flex-wrap:wrap;gap:5px}.actions button{font-size:13px;margin:5px 0}#message{min-height:25px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="./dominus-config.js"></script><script src="./dominus-auth.js"></script><title>DOMINUS V20 – ADMIN</title></head><body><main><div class="panel"><h1>DOMINUS V20 · ADMIN</h1><p id="who" class="muted">Verificare cont…</p><button class="secondary" onclick="DominusAuth.signOut()">Deconectare</button><a class="link secondary" href="./index.html">Formularele V19 (doar ADMIN)</a><h2>Invită tehnician</h2><form id="invite"><label>Nume complet<input id="name" maxlength="150" required></label><label>E-mail<input id="email" type="email" required></label><label>Telefon<input id="phone" maxlength="40"></label><button type="submit">Trimite invitație</button></form><p id="message" role="status"></p><h2>Tehnicieni</h2><button id="refresh" class="secondary">Actualizează lista</button><div id="list"></div></div></main><script>
const $=id=>document.getElementById(id),a=DominusAuth;let profile=null;
function status(t,bad=false){$('message').className=bad?'error':'ok';$('message').textContent=t;}
async function invoke(body){const {data:{session},error:se}=await a.client.auth.getSession();if(se||!session)throw Error('Sesiune expirată. Conectează-te din nou.');const res=await fetch(window.DOMINUS_CONFIG.url+'/functions/v1/admin-users',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':window.DOMINUS_CONFIG.publishableKey},body:JSON.stringify(body)});const result=await res.json().catch(()=>({}));if(!res.ok)throw Error(result.error||'Eroare '+res.status);return result;}
async function load(){try{const {technicians=[]}=await invoke({action:'list'});const list=$('list');list.replaceChildren();if(!technicians.length){list.textContent='Niciun tehnician.';return;}for(const t of technicians){const wrap=document.createElement('div');wrap.className='entry';const title=document.createElement('strong');title.textContent=t.full_name+' · '+(t.active?'Activ':'Dezactivat');wrap.append(title);const info=document.createElement('p');info.textContent=(t.email||'')+' · '+(t.phone||'');wrap.append(info);const actions=document.createElement('div');actions.className='actions';for(const [label,fn] of [['Editează',async()=>{const full_name=prompt('Nume complet',t.full_name);if(full_name===null)return;const email=prompt('E-mail',t.email||'');if(email===null)return;const phone=prompt('Telefon',t.phone||'');if(phone===null)return;await invoke({action:'update',id:t.id,full_name,email,phone});}],[(t.active?'Dezactivează':'Reactivează'),async()=>{if(!confirm('Confirmi modificarea stării contului?'))return;await invoke({action:'set_active',id:t.id,active:!t.active});}],['Resetare parolă',async()=>{if(!confirm('Trimitem e-mail de resetare?'))return;await invoke({action:'reset_password',id:t.id});}]]){const b=document.createElement('button');b.textContent=label;b.className='secondary';b.onclick=async()=>{b.disabled=true;try{await fn();status('Operațiune efectuată.');await load();}catch(e){status(e.message,true);}finally{b.disabled=false;}};actions.append(b);}wrap.append(actions);list.append(wrap);}}catch(e){status(e.message,true);}}
(async()=>{if(!a.configured){location.replace('./login.html');return;}profile=await a.profile();if(!profile||profile.role!=='admin'){location.replace('./login.html');return;}$('who').textContent='Autentificat: '+profile.full_name;await load();})();
$('refresh').onclick=load;
$('invite').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await invoke({action:'create',full_name:$('name').value.trim(),email:$('email').value.trim(),phone:$('phone').value.trim()||null});status('Invitația a fost solicitată. Verifică livrarea e-mailului.');$('invite').reset();await load();}catch(e){status(e.message,true);}finally{b.disabled=false;}};
</script></body></html>
